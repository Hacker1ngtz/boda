<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boda Jeshua & Angelli</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body.no-scroll { overflow: hidden; }
body { font-family: 'Poppins', sans-serif; }
h1,h2,h3 { font-family: 'Playfair Display', serif; }

/* SOBRE */
#envelope-wrapper {
  position: fixed;
  inset: 0;
  background: #fdfbf7;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.envelope {
  position: relative;
  width: 300px;
  height: 200px;
  background: #698274;
  cursor: pointer;
}

.envelope::before {
  content: '';
  position: absolute;
  bottom: 0;
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-bottom: 100px solid #EFE9DF;
}

.envelope-right {
  position: absolute;
  right: 0;
  border-top: 100px solid transparent;
  border-right: 150px solid #E8E0D5;
  border-bottom: 100px solid transparent;
}

.flap {
  position: absolute;
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-top: 110px solid #DFD5C7;
  transform-origin: top;
  transition: 0.8s;
}

.seal {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.letter {
  position: absolute;
  inset: 10px;
  background: white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.envelope.open .flap { transform: rotateX(180deg); }
.envelope.open .letter { transform: translateY(-150px); }

/* ANIMACIONES */
.animar {
  opacity: 0;
  transform: translateY(40px);
  transition: 1s;
}
.animar.visible {
  opacity: 1;
  transform: translateY(0);
}

/* PÉTALOS */
.petalo {
  position: fixed;
  top: -10px;
  width: 8px;
  height: 8px;
  background: pink;
  border-radius: 50%;
  animation: caer linear infinite;
}
@keyframes caer {
  100% { transform: translateY(100vh); }
}
</style>

</head>

<body class="no-scroll">

<!-- SOBRE -->
<div id="envelope-wrapper">
  <div class="envelope" onclick="abrirSobre()" id="sobre">
    <div class="flap"></div>
    <div class="envelope-right"></div>
    <div class="seal">J&A</div>
    <div class="letter">Jeshua & Angelli</div>
  </div>
  <p>Presiona el sobre</p>
</div>

<!-- TU CONTENIDO (NO LO TOQUÉ) -->
<nav class="animar">
  <a class="logo-privado" href="#">J&A</a>
</nav>

<section id="inicio" class="portada animar">
  <h1>Nos casamos</h1>
  <p>Jeshua & Angelli</p>
</section>

<section id="ubicacion" class="animar">
  <h2>Ubicación</h2>

  <iframe 
    src="https://www.google.com/maps?q=Salon+Naturafrut+San+Pedro+Tapanatepec+Oaxaca&output=embed"
    width="100%" height="300">
  </iframe>
</section>

<footer class="animar">
  <p>JESHUA & ANGELLI</p>
</footer>

<script>
function abrirSobre() {
  const sobre = document.getElementById("sobre");
  const wrapper = document.getElementById("envelope-wrapper");

  sobre.classList.add("open");

  setTimeout(() => {
    wrapper.style.opacity = "0";
    document.body.classList.remove("no-scroll");

    setTimeout(() => {
      wrapper.style.display = "none";
    }, 800);

  }, 800);
}

/* SCROLL */
const els = document.querySelectorAll('.animar');
window.addEventListener('scroll', () => {
  els.forEach(el => {
    if (el.getBoundingClientRect().top < window.innerHeight - 50) {
      el.classList.add('visible');
    }
  });
});

/* PÉTALOS */
for (let i = 0; i < 20; i++) {
  let p = document.createElement("div");
  p.className = "petalo";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = (5 + Math.random() * 5) + "s";
  document.body.appendChild(p);
}
</script>

</body>
</html>
