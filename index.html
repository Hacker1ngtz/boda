<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Tipografías elegantes -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<title>Boda Jeshua & Angelli</title>

<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  background: #f6f3ef;
  color: #3d3d3d;
  overflow-x: hidden;
}

/* SOBRE */
.screen {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.envelope {
  width: 280px;
  height: 180px;
  background: linear-gradient(145deg, #d8c29d, #bfa46f);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
}

.envelope:before {
  content: "";
  position: absolute;
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-top: 90px solid #b59455;
  top: 0;
  transform-origin: top;
  transition: 1s;
}

.seal {
  position: absolute;
  width: 70px;
  height: 70px;
  background: #7a0000;
  border-radius: 50%;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.open:before {
  transform: rotateX(180deg);
}

/* INVITACIÓN */
.invite {
  display: none;
}

/* SECCIONES */
.section {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px;
  opacity: 0;
  transform: translateY(40px);
  transition: 1s;
}

.section.show {
  opacity: 1;
  transform: translateY(0);
}

/* HERO */
.hero h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 60px;
  color: #000;
}

.hero p {
  font-size: 18px;
}

/* FRASE */
.quote {
  font-size: 20px;
  max-width: 500px;
  margin: auto;
}

/* FECHA */
.date {
  font-size: 50px;
  margin: 20px 0;
  color: #a88c5a;
}

/* LUGAR */
.place {
  font-size: 20px;
}

/* BOTÓN */
.btn {
  padding: 14px 28px;
  border-radius: 30px;
  background: #a88c5a;
  color: white;
  text-decoration: none;
  margin-top: 20px;
  display: inline-block;
}

/* CONTADOR */
.countdown {
  margin-top: 20px;
  font-size: 18px;
  color: #7a6a4f;
}

/* FLORES DECORATIVAS */
.flower-top {
  position: absolute;
  top: 0;
  width: 100%;
  opacity: 0.15;
}

.flower-bottom {
  position: absolute;
  bottom: 0;
  width: 100%;
  opacity: 0.15;
}
</style>
</head>

<body>

<!-- SOBRE -->
<div class="screen" id="screen">
  <div class="envelope" id="env">
    <div class="seal">J&A</div>
  </div>
</div>

<!-- INVITACIÓN -->
<div class="invite" id="invite">

  <!-- FRASE -->
  <div class="section">
    <div class="quote">
      “El que halla esposa halla el bien, y alcanza la benevolencia de Jehová.”<br>
      — Proverbios 18:22
    </div>
  </div>

  <!-- NOMBRES -->
  <div class="section hero">
    <div>
      <h1>Jeshua & Angelli</h1>
      <p>Queremos que seas parte de uno de los días más importantes de nuestras vidas</p>
    </div>
  </div>

  <!-- FECHA -->
  <div class="section">
    <div>
      <div class="date">30 Mayo</div>
      <p>Sábado · 1:00 PM</p>
    </div>
  </div>

  <!-- LUGAR -->
  <div class="section">
    <div class="place">
      San Pedro Tapanatepec, Oaxaca<br>
      <b>Salón NaturaFrut</b>
    </div>
  </div>

  <!-- BOTÓN -->
  <div class="section">
    <div>
      <a class="btn"
         href="https://maps.google.com/?q=Salon+NaturaFrut+Oaxaca"
         target="_blank">
         Ver ubicación
      </a>

      <div class="countdown" id="countdown"></div>
    </div>
  </div>

</div>

<script>
const env = document.getElementById("env");
const screen = document.getElementById("screen");
const invite = document.getElementById("invite");

env.addEventListener("click", () => {
  env.classList.add("open");

  setTimeout(() => {
    screen.style.display = "none";
    invite.style.display = "block";
    document.body.style.overflow = "auto";
  }, 1000);
});

/* ANIMACIÓN SCROLL */
const sections = document.querySelectorAll(".section");

window.addEventListener("scroll", () => {
  sections.forEach(sec => {
    const top = sec.getBoundingClientRect().top;
    if (top < window.innerHeight - 100) {
      sec.classList.add("show");
    }
  });
});

/* COUNTDOWN */
const eventDate = new Date("2024-05-30T13:00:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const d = eventDate - now;

  if (d <= 0) {
    document.getElementById("countdown").innerHTML = "¡Hoy es el gran día!";
    return;
  }

  const days = Math.floor(d / (1000 * 60 * 60 * 24));
  const hours = Math.floor((d / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((d / (1000 * 60)) % 60);

  document.getElementById("countdown").innerHTML =
    `${days} días · ${hours} hrs · ${minutes} min`;

}, 1000);
</script>

</body>
</html>
